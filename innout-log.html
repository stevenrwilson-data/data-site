<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Queue Log — Steven R Wilson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#041F2C;
    --blue:#08415C;
    --plum:#511730;
    --brick:#8E443D;
    --salmon:#F7A399;
    --sand:#E0D68A;
    --plate:#F4F0E6;
    --plum-ink:#3A0F21;
    --rule:rgba(247,163,153,.24);
    --font-display:'Archivo Black',sans-serif;
    --font-body:'Montserrat',system-ui,sans-serif;
    --font-code:'Source Code Pro',ui-monospace,monospace;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  body{
    margin:0;
    background:var(--field);
    color:var(--salmon);
    font-family:var(--font-body);
    font-size:17px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }

  .wrap{max-width:600px;margin:0 auto;padding:0 24px 56px;}
  :focus-visible{outline:3px solid var(--sand);outline-offset:3px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}

  .eyebrow{
    font-size:12px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--brick);
    margin:0 0 12px;
  }

  /* ---------- clock head ---------- */
  .head{
    position:sticky;top:0;z-index:10;
    background:var(--field);
    border-bottom:1px solid var(--rule);
    padding:18px 0 16px;
  }
  .mark{
    font-family:var(--font-display);
    font-size:14px;color:var(--sand);
    text-transform:uppercase;letter-spacing:.02em;
  }
  .mark .bar{color:var(--brick);padding:0 8px;}
  .clock{
    font-family:var(--font-code);font-weight:600;
    font-size:clamp(46px,15vw,68px);
    line-height:1;letter-spacing:-.03em;
    color:var(--sand);
    font-variant-numeric:tabular-nums;
    margin:10px 0 4px;
  }
  .statline{
    display:flex;justify-content:space-between;gap:16px;
    font-family:var(--font-code);font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;
    font-variant-numeric:tabular-nums;
  }
  .statline .el{color:var(--sand);}
  .statline .el.off{color:var(--brick);}
  .statline .el.done{color:var(--salmon);}
  .statline .ct{color:var(--salmon);opacity:.7;}

  /* ---------- mode switch ---------- */
  .modes{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
    margin:26px 0 0;
  }
  .modes button{
    font-family:var(--font-body);
    font-weight:700;font-size:12px;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--salmon);background:transparent;
    border:1px solid var(--rule);
    border-radius:999px;padding:14px 0;cursor:pointer;
    transition:background .18s ease,color .18s ease,border-color .18s ease;
  }
  .modes button[aria-pressed="true"]{
    background:var(--sand);color:var(--field);border-color:var(--sand);
  }

  /* ---------- run totals ---------- */
  .stats{
    display:flex;gap:40px;flex-wrap:wrap;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    padding:18px 0;margin:22px 0;
  }
  .stat .val{
    font-family:var(--font-display);
    font-size:24px;line-height:1.1;
    color:var(--sand);display:block;
    font-variant-numeric:tabular-nums;
  }
  .stat .lab{
    font-size:11px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--salmon);
    display:block;margin-top:6px;
  }

  /* ---------- action pad ---------- */
  .pad{display:grid;gap:12px;margin-bottom:26px;}
  .pad.cars{grid-template-columns:1fr 1fr;}

  .act{
    font-family:var(--font-display);
    font-size:19px;line-height:1.08;letter-spacing:-.01em;
    text-transform:uppercase;text-align:left;
    border:none;border-radius:24px;
    min-height:104px;padding:20px;
    cursor:pointer;
    transition:transform .16s ease,box-shadow .16s ease;
  }
  .act:active{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.45);}
  .act .sub{
    display:block;
    font-family:var(--font-body);
    font-weight:600;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;
    margin-top:10px;opacity:.82;
  }

  .act.timer{
    grid-column:1/-1;min-height:74px;
    background:var(--sand);color:var(--plum);
    font-size:17px;
  }
  .act.timer.running{
    background:transparent;color:var(--salmon);
    border:1px solid rgba(142,68,61,.9);
  }
  .act.car{background:var(--blue);color:var(--sand);}
  .act.car .sub{color:var(--salmon);}
  .act.hold{background:var(--brick);color:var(--sand);}
  .act.hold .sub{color:#F9DDD7;}
  .act.up{
    grid-column:1/-1;min-height:84px;
    background:var(--plum);color:var(--sand);
  }
  .act.up .sub{color:var(--salmon);}

  /* ---------- text entry ---------- */
  .entry{margin-bottom:22px;}
  .entry .row{display:grid;grid-template-columns:1fr auto;gap:10px;}
  .entry input{
    font-family:var(--font-code);
    font-size:19px;font-weight:500;
    color:var(--sand);
    background:rgba(8,65,92,.6);
    border:1px solid var(--rule);
    border-radius:14px;padding:15px 16px;
    width:100%;min-width:0;
  }
  #note,#emailto{font-family:var(--font-body);font-size:16px;}
  .entry input:focus{border-color:var(--sand);}
  .entry input::placeholder{color:rgba(247,163,153,.45);}
  .entry .go{
    font-family:var(--font-body);
    font-weight:700;font-size:12px;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--field);background:var(--sand);
    border:none;border-radius:999px;
    padding:0 24px;cursor:pointer;
    transition:background .18s ease;
  }
  .entry .go:hover{background:var(--salmon);}

  /* ---------- log ---------- */
  .logtop{
    border-top:1px solid var(--rule);
    padding-top:24px;margin-top:34px;
  }
  .logtop .eyebrow{margin:0 0 14px;}
  .logactions{display:flex;gap:8px;flex-wrap:wrap;}
  .save{
    font-family:var(--font-body);
    font-weight:700;font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--sand);background:transparent;
    border:1px solid var(--rule);border-radius:999px;
    padding:11px 18px;cursor:pointer;white-space:nowrap;
    transition:background .18s ease,color .18s ease,opacity .18s ease;
  }
  .save:hover{background:var(--sand);color:var(--field);}
  .save.undo{color:var(--salmon);border-color:rgba(142,68,61,.9);}
  .save.undo:hover{background:var(--brick);color:var(--sand);border-color:var(--brick);}
  .save:disabled{opacity:.35;cursor:default;}
  .save:disabled:hover{background:transparent;color:var(--sand);}
  .save.undo:disabled:hover{color:var(--salmon);border-color:rgba(142,68,61,.9);}

  .emailrow{margin:16px 0 0;}

  .textout{
    background:var(--plate);
    color:var(--plum-ink);
    border-radius:18px;
    margin:18px 0 0;padding:20px 18px;
    font-family:var(--font-code);
    font-size:12.5px;line-height:1.55;
    white-space:pre-wrap;overflow-wrap:anywhere;
    font-variant-numeric:tabular-nums;
  }

  ol.log{
    list-style:none;margin:18px 0 0;padding:0;
    font-family:var(--font-code);font-size:14px;
  }
  ol.log li{
    display:grid;grid-template-columns:80px 58px 1fr;
    gap:10px;align-items:baseline;
    padding:11px 0;border-bottom:1px solid rgba(247,163,153,.12);
  }
  ol.log .ts{color:var(--salmon);opacity:.75;font-variant-numeric:tabular-nums;}
  ol.log .md{
    font-family:var(--font-body);font-weight:700;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--brick);
  }
  ol.log .ev{color:var(--salmon);overflow-wrap:anywhere;}
  ol.log li.k-timer .ev{color:var(--sand);font-weight:600;}
  ol.log li.k-timerend .ev{color:var(--sand);font-weight:600;}
  ol.log li.k-car .ev{color:var(--sand);}
  ol.log li.k-hold .ev{color:#E58C7F;}
  ol.log li.k-up .ev{color:var(--plate);}
  ol.log li.k-order .ev{color:var(--sand);}
  ol.log li.repeat .ev{color:#E58C7F;}
  ol.log li.repeat .md{color:var(--brick);}
  .warn{
    font-family:var(--font-code);font-size:13px;
    color:#E58C7F;margin:10px 0 0;line-height:1.45;
  }
  ol.log li.k-note .ev{
    font-family:var(--font-body);font-size:15px;
    color:var(--salmon);opacity:.85;
  }
  .empty{
    font-family:var(--font-code);font-size:13px;
    color:var(--salmon);opacity:.55;
    padding:20px 0;margin:0;
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="head">
    <div class="mark">Queue Log <span class="bar">|</span> <span id="today">—</span></div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="statline">
      <span class="el off" id="elapsed">No timer running</span>
      <span class="ct" id="count">0 entries</span>
    </div>
  </header>

  <div class="modes" role="group" aria-label="Mode">
    <button id="m-cars" aria-pressed="true">Drive-thru</button>
    <button id="m-counter" aria-pressed="false">Counter</button>
  </div>

  <!-- CARS -->
  <div id="wrap-cars">
    <div class="stats">
      <div class="stat">
        <span class="val" id="s-cars">0</span>
        <span class="lab">Cars this run</span>
      </div>
      <div class="stat">
        <span class="val" id="s-cars-avg">—</span>
        <span class="lab">Avg between cars</span>
      </div>
    </div>
    <div class="pad cars">
      <button class="act timer" id="cars-timer">Start drive-thru timer</button>
      <button class="act car" id="cars-car">Car<span class="sub">Next number + time</span></button>
      <button class="act hold" id="cars-hold">Not moving up<span class="sub">Held at payment</span></button>
      <button class="act up" id="cars-up">Up<span class="sub">Moved to pickup</span></button>
    </div>
  </div>

  <!-- COUNTER -->
  <div id="wrap-counter" hidden>
    <div class="stats">
      <div class="stat">
        <span class="val" id="s-orders">0</span>
        <span class="lab">Orders this run</span>
      </div>
      <div class="stat">
        <span class="val" id="s-orders-avg">—</span>
        <span class="lab">Avg between orders</span>
      </div>
    </div>
    <div class="pad">
      <button class="act timer" id="ctr-timer">Start counter timer</button>
      <div class="entry">
        <p class="eyebrow">Orders handed out</p>
        <div class="row">
          <input id="orders" type="text" inputmode="text" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false"
                 placeholder="23,26   or   x">
          <button class="go" id="orders-go">Log</button>
        </div>
        <p class="warn" id="dupwarn" hidden></p>
      </div>
    </div>
  </div>

  <div class="entry">
    <p class="eyebrow">Note</p>
    <div class="row">
      <input id="note" type="text" autocomplete="off" placeholder="Diner half full, no line, 4 kitchen staff">
      <button class="go" id="note-go">Log</button>
    </div>
  </div>

  <div class="logtop">
    <p class="eyebrow">Log</p>
    <div class="logactions">
      <button class="save undo" id="undo">Undo last</button>
      <button class="save" id="copy">Copy log</button>
      <button class="save" id="show">Show text</button>
      <button class="save" id="share">Send as file</button>
      <button class="save" id="save">Save log file</button>
    </div>
    <div class="entry emailrow">
      <p class="eyebrow">Email to</p>
      <div class="row">
        <input id="emailto" type="email" inputmode="email" autocomplete="email"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="you@example.com">
        <button class="go" id="email">Create</button>
      </div>
    </div>
  </div>
  <pre class="textout" id="textout" hidden></pre>
  <ol class="log" id="log"></ol>
  <p class="empty" id="empty">No entries yet.</p>

</div>

<script>
(function(){
  /* entry: {at:Date, time:'HH:MM:SS', mode:'drive-thru'|'counter', kind, text, n} */
  var entries = [];
  var carNum  = 0;
  var mode    = 'drive-thru';
  var startAt = null;   // Date of the running timer, null when none
  var runMode = null;   // which mode the running timer belongs to
  var endAt   = null;   // Date the last run ended, null while running

  var $ = function(id){ return document.getElementById(id); };

  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function hms(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function dateStr(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function dur(sec){
    sec = Math.max(0, Math.round(sec));
    return pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor(sec / 60) % 60) + ':' + pad(sec % 60);
  }
  function short(sec){
    sec = Math.max(0, Math.round(sec));
    if (sec >= 3600) return dur(sec);
    return Math.floor(sec / 60) + ':' + pad(sec % 60);
  }
  function label(m){ return m === 'counter' ? 'COUNTER' : 'DRIVE-THRU'; }

  /* ---- clock ---- */
  function tick(){
    var now = new Date();
    $('clock').textContent = hms(now);
    $('today').textContent = dateStr(now);
    var el = $('elapsed');
    if (startAt) {
      el.textContent = label(runMode) + ' ' + dur((now - startAt) / 1000);
      el.className = 'el';
    } else if (endAt) {
      el.className = 'el done';
    } else {
      el.textContent = 'No timer running';
      el.className = 'el off';
    }
  }
  setInterval(tick, 250);

  /* ---- log ---- */
  function add(kind, text, n, extra){
    var now = new Date();
    var e = {
      at: now, time: hms(now), mode: mode,
      kind: kind, text: text, n: n || 0,
      nums: (extra && extra.nums) || [],
      repeat: !!(extra && extra.repeat)
    };
    entries.push(e);
    render();
  }

  /* Entries logged since the current (or most recent) timer start. */
  function runEntries(){
    for (var i = entries.length - 1; i >= 0; i--) {
      if (entries[i].kind === 'timer') return entries.slice(i + 1);
    }
    return entries.slice();
  }

  function runStats(){
    var run = runEntries();
    var cars = 0, orders = 0;
    var firstCar = null, lastCar = null, firstOrder = null, lastOrder = null;
    for (var i = 0; i < run.length; i++) {
      var e = run[i];
      if (e.kind === 'car') {
        cars++;
        if (!firstCar) firstCar = e.at;
        lastCar = e.at;
      }
      if (e.kind === 'order' && e.n > 0) {
        orders += e.n;
        if (!firstOrder) firstOrder = e.at;
        lastOrder = e.at;
      }
    }
    return {
      cars: cars,
      orders: orders,
      /* mean gap between consecutive logged events */
      carAvg:   cars   > 1 ? (lastCar   - firstCar)   / 1000 / (cars   - 1) : null,
      orderAvg: orders > 1 ? (lastOrder - firstOrder) / 1000 / (orders - 1) : null
    };
  }

  function render(){
    var ol = $('log');
    ol.innerHTML = '';
    for (var i = entries.length - 1; i >= 0; i--) {
      var e = entries[i];
      var li = document.createElement('li');
      li.className = 'k-' + e.kind + (e.repeat ? ' repeat' : '');
      var a = document.createElement('span'); a.className = 'ts'; a.textContent = e.time;
      var b = document.createElement('span'); b.className = 'md'; b.textContent = e.mode;
      var c = document.createElement('span'); c.className = 'ev'; c.textContent = e.text;
      li.appendChild(a); li.appendChild(b); li.appendChild(c);
      ol.appendChild(li);
    }
    $('empty').hidden = entries.length > 0;
    $('count').textContent = entries.length + (entries.length === 1 ? ' entry' : ' entries');
    $('undo').disabled = entries.length === 0;

    var s = runStats();
    $('s-cars').textContent = s.cars;
    $('s-orders').textContent = s.orders;
    $('s-cars-avg').textContent   = s.carAvg   === null ? '—' : short(s.carAvg);
    $('s-orders-avg').textContent = s.orderAvg === null ? '—' : short(s.orderAvg);

    if (!$('textout').hidden) $('textout').textContent = logText();
  }

  /* ---- timer ---- */
  function timerFace(){
    var running = !!startAt;
    $('cars-timer').textContent = running ? 'End timer' : 'Start drive-thru timer';
    $('ctr-timer').textContent  = running ? 'End timer' : 'Start counter timer';
    $('cars-timer').classList.toggle('running', running);
    $('ctr-timer').classList.toggle('running', running);
  }

  function toggleTimer(){
    if (startAt) {
      var now = new Date();
      var secs = (now - startAt) / 1000;
      var was = runMode;
      endAt = now;
      startAt = null;
      runMode = null;
      $('elapsed').textContent = label(was) + ' ended ' + dur(secs);
      add('timerend', 'TIMER ENDED — ' + label(was) + ' — RUN ' + dur(secs));
    } else {
      startAt = new Date();
      runMode = mode;
      endAt = null;
      add('timer', 'TIMER STARTED — ' + label(mode));
    }
    timerFace();
    tick();
  }
  $('cars-timer').addEventListener('click', toggleTimer);
  $('ctr-timer').addEventListener('click', toggleTimer);

  /* ---- drive-thru ---- */
  $('cars-car').addEventListener('click', function(){
    carNum++;
    add('car', 'CAR ' + carNum);
  });
  $('cars-hold').addEventListener('click', function(){
    add('hold', 'NOT MOVING UP');
  });
  $('cars-up').addEventListener('click', function(){
    add('up', 'UP');
  });

  /* ---- counter text entry ---- */
  /* First time each order number was logged in this run. */
  function seenNumbers(){
    var seen = {};
    var run = runEntries();
    for (var i = 0; i < run.length; i++) {
      var ns = run[i].nums || [];
      for (var j = 0; j < ns.length; j++) {
        if (!(ns[j] in seen)) seen[ns[j]] = run[i].time;
      }
    }
    return seen;
  }

  function submitOrders(){
    var raw = $('orders').value.trim();
    if (!raw) return;
    var tokens = raw.split(/[,\s]+/).filter(Boolean);
    var nums = [], xs = 0;
    for (var i = 0; i < tokens.length; i++) {
      if (/^x$/i.test(tokens[i])) { xs++; }
      else { nums.push(tokens[i]); }
    }

    var seen = seenNumbers();
    var dupes = [], notes = [], counted = {};
    for (var k = 0; k < nums.length; k++) {
      var v = nums[k];
      if (v in seen) {
        dupes.push(v);
        notes.push(v + ' first at ' + seen[v]);
      } else if (counted[v]) {
        dupes.push(v);
        notes.push(v + ' twice in this entry');
      }
      counted[v] = true;
    }

    var warn = $('dupwarn');
    if (dupes.length) {
      warn.textContent = 'REPEAT: ' + notes.join('   ');
      warn.hidden = false;
    } else {
      warn.textContent = '';
      warn.hidden = true;
    }

    var tag = dupes.length ? ' — REPEAT: ' + dupes.join(', ') : '';
    var flag = { nums: nums, repeat: dupes.length > 0 };
    var keep = nums.length - dupes.length;

    if (nums.length === 1) {
      add('order', 'ORDER ' + nums[0] + tag, keep, flag);
    } else if (nums.length > 1) {
      add('order', 'ORDERS ' + nums.join(', ') + ' (simultaneous)' + tag, keep, flag);
    }
    for (var j = 0; j < xs; j++) {
      add('order', 'X (no announced order)', 1);
    }
    $('orders').value = '';
    $('orders').focus();
  }
  $('orders-go').addEventListener('click', submitOrders);
  $('orders').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') { ev.preventDefault(); submitOrders(); }
  });

  /* ---- notes ---- */
  function submitNote(){
    var v = $('note').value.trim();
    if (!v) return;
    add('note', v);
    $('note').value = '';
  }
  $('note-go').addEventListener('click', submitNote);
  $('note').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') { ev.preventDefault(); submitNote(); }
  });

  /* ---- undo ---- */
  $('undo').addEventListener('click', function(){
    if (!entries.length) return;
    var e = entries.pop();
    if (e.kind === 'car' && carNum > 0) carNum--;
    if (e.kind === 'timer') { startAt = null; runMode = null; }
    if (e.kind === 'timerend') {
      /* put the run back the way it was */
      for (var i = entries.length - 1; i >= 0; i--) {
        if (entries[i].kind === 'timer') {
          startAt = entries[i].at;
          runMode = entries[i].mode;
          break;
        }
      }
      endAt = null;
    }
    timerFace();
    tick();
    render();
  });

  /* ---- mode switch ---- */
  function setMode(m){
    mode = m;
    var cars = m === 'drive-thru';
    $('m-cars').setAttribute('aria-pressed', cars ? 'true' : 'false');
    $('m-counter').setAttribute('aria-pressed', cars ? 'false' : 'true');
    $('wrap-cars').hidden = !cars;
    $('wrap-counter').hidden = cars;
  }
  $('m-cars').addEventListener('click', function(){ setMode('drive-thru'); });
  $('m-counter').addEventListener('click', function(){ setMode('counter'); });

  /* ---- log text ---- */
  function logText(){
    var now = new Date();
    var s = runStats();
    var lines = [];
    lines.push('QUEUE LOG');
    lines.push('Source: data gathered manually in-store with the Queue Log web app.');
    lines.push('Date: ' + dateStr(now));
    lines.push('Saved: ' + hms(now));
    lines.push('Entries: ' + entries.length);
    lines.push('');
    lines.push('CURRENT RUN');
    lines.push('  Cars: ' + s.cars + (s.carAvg === null ? '' : '   Avg between cars: ' + short(s.carAvg)));
    lines.push('  Orders: ' + s.orders + (s.orderAvg === null ? '' : '   Avg between orders: ' + short(s.orderAvg)));
    lines.push('  Averages = mean interval between consecutive logged events in this run.');
    lines.push('');
    lines.push('TIME      MODE        EVENT');
    lines.push('------------------------------------------------------------');
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var m = (e.mode + '          ').slice(0, 10);
      var k = e.kind === 'note' ? 'NOTE: ' : '';
      lines.push(e.time + '  ' + m + '  ' + k + e.text);
    }
    return lines.join('\n');
  }

  /* ---- copy log ---- */
  function flash(btn, msg){
    var was = btn.textContent;
    btn.textContent = msg;
    setTimeout(function(){ btn.textContent = was; }, 1400);
  }

  function legacyCopy(text, btn){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    flash(btn, ok ? 'Copied' : 'Copy failed');
  }

  $('copy').addEventListener('click', function(){
    var btn = this;
    var text = logText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        flash(btn, 'Copied');
      }, function(){
        legacyCopy(text, btn);
      });
    } else {
      legacyCopy(text, btn);
    }
  });

  /* ---- show text (screenshot fallback) ---- */
  $('show').addEventListener('click', function(){
    var pre = $('textout');
    if (pre.hidden) {
      pre.textContent = logText();
      pre.hidden = false;
      this.textContent = 'Hide text';
    } else {
      pre.hidden = true;
      this.textContent = 'Show text';
    }
  });

  /* ---- email log ---- */
  function createEmail(){
    var to = $('emailto').value.trim();
    if (!to) { $('emailto').focus(); return; }
    var href = 'mailto:' + encodeURIComponent(to) +
               '?subject=' + encodeURIComponent('Queue Log ' + dateStr(new Date())) +
               '&body=' + encodeURIComponent(logText());
    window.location.href = href;
  }
  $('email').addEventListener('click', createEmail);
  $('emailto').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') { ev.preventDefault(); createEmail(); }
  });

  /* ---- file name + download ---- */
  function fileName(){ return 'innout-log-' + dateStr(new Date()) + '.txt'; }

  function downloadFile(text, name){
    var blob = new Blob([text], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  $('save').addEventListener('click', function(){
    downloadFile(logText(), fileName());
  });

  /* ---- send as file (share sheet) ---- */
  $('share').addEventListener('click', function(){
    var btn = this;
    var text = logText();
    var name = fileName();
    var file = null;
    try { file = new File([text], name, { type: 'text/plain' }); } catch (err) { file = null; }

    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Queue Log' }).catch(function(err){
        if (err && err.name === 'AbortError') return;
        downloadFile(text, name);
        flash(btn, 'Saved instead');
      });
    } else {
      downloadFile(text, name);
      flash(btn, 'Saved instead');
    }
  });

  timerFace();
  tick();
  render();
})();
</script>

</body>
</html>
